aid: couchsurfing
name: Couchsurfing
description: Couchsurfing is a community-driven travel and hospitality-exchange platform that connects
  travelers with local hosts offering free accommodation, local meetups, and cultural exchange across
  more than 200,000 cities worldwide. Members build trust through verified profiles, references, and
  community events, and use the service to find places to stay, meet locals, and discover events while
  traveling. Couchsurfing publishes no official public developer API or developer portal; this API
  Evangelist profile tracks the company's public web, trust, and policy surface for discovery and
  monitoring, and was originally surfaced as a portfolio company of General Catalyst and Point Nine.
